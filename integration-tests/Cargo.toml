[package]
name = "integration-tests"
version = "0.1.0"
edition.workspace = true
publish = false

# This crate exists purely for integration testing across the Ulo framework.
# It depends on all components to test their interactions.

[dependencies]
ulo = { path = "../crates/ulo", features = ["tower-compat"] }
tower = { workspace = true, features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "compression-gzip"] }
http.workspace = true
ulo-config = { path = "../crates/ulo-config" }
ulo-macros = { path = "../crates/ulo-macros" }
ulo-http-axum = { path = "../crates/ulo-http-axum" }
ulo-http-poem = { path = "../crates/ulo-http-poem" }
ulo-http-salvo = { path = "../crates/ulo-http-salvo" }
ulo-http-actix = { path = "../crates/ulo-http-actix" }
ulo-http-rocket = { path = "../crates/ulo-http-rocket" }
ulo-ws-tungstenite = { path = "../crates/ulo-ws-tungstenite" }
ulo-rpc-tcp = { path = "../crates/ulo-rpc-tcp" }
ulo-rpc-udp = { path = "../crates/ulo-rpc-udp" }
ulo-grpc = { path = "../crates/ulo-grpc", features = ["tls-ring"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
prost-types = "0.14"
tonic-types = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
ulo-graphql-async-graphql = { path = "../crates/ulo-graphql-async-graphql" }
ulo-graphql-juniper = { path = "../crates/ulo-graphql-juniper" }
# Direct dependencies required by the GraphQL derive macros: both emit
# crate-anchored paths (::async_graphql, ::juniper) which the integration
# crates' re-exports cannot satisfy. Matches the documented consumer setup.
async-graphql = "7"
juniper = "0.16"

# Testing dependencies
tokio = { workspace = true, features = ["full"] }
bytes.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serial_test = "3.2.0"
validator = { workspace = true, features = ["derive"] }
rand = "0.8"
# Mints a self-signed certificate per test run, so no fixture expires.
rcgen = "0.13"
uuid = { workspace = true, features = ["v4"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
async-stream = "0.3"
anyhow.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
ulo-build = { path = "../crates/ulo-build" }
# The manual (no-proto) codegen path, for a service whose method name and route
# name diverge — see tests/integration/grpc_manual_trait_form.rs.
tonic-build = "0.14"
