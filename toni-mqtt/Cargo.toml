[package]
name = "toni-mqtt"
version = "0.1.0"
edition.workspace = true
description = "MQTT v5 transport adapter for the Toni RPC gateway"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["toni", "mqtt", "rpc", "framework", "adapter"]
categories = ["network-programming"]

[features]
# Gates tests that need a live MQTT broker (via testcontainers + Docker).
integration = []

[dependencies]
toni = { path = "../toni", default-features = false }
rumqttc = "0.25"
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
futures = { workspace = true, features = ["async-await", "executor"] }

[dev-dependencies]
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["mosquitto"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream.workspace = true
