[package]
name = "toni-redis"
version = "0.1.0"
edition.workspace = true
description = "Redis integration for the Toni framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
health = ["dep:toni-terminus", "dep:serde_json", "dep:futures"]
integration = ["health"]

[dependencies]
toni = { path = "../toni", default-features = false }
# Timer for the startup check's retry delay. Executor-independent, so core stays free of a
# runtime and this crate does not acquire one either.
futures-timer.workspace = true
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
async-trait.workspace = true
tracing.workspace = true
toni-terminus = { path = "../toni-terminus", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["redis"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
toni-axum = { path = "../toni-axum" }
reqwest = { version = "0.13.2", features = ["json"] }
