[package]
name = "ex-38-tracing"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ulo = { path = "../../crates/ulo" }
ulo-config = { path = "../../crates/ulo-config" }
ulo-grpc = { path = "../../crates/ulo-grpc" }
ulo-http = { path = "../../crates/ulo-http" }
ulo-http-hyper = { path = "../../crates/ulo-http-hyper" }
ulo-otel = { path = "../../crates/ulo-otel" }
ulo-otel-otlp = { path = "../../crates/ulo-otel-otlp" }
ulo-rpc = { path = "../../crates/ulo-rpc" }
ulo-rpc-tcp = { path = "../../crates/ulo-rpc-tcp" }
ulo-runtime-tokio = { path = "../../crates/ulo-runtime-tokio" }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["std", "registry"] }
# What the generated code names.
prost.workspace = true
tonic = { workspace = true, features = ["channel", "codegen"] }
tonic-prost.workspace = true

[build-dependencies]
ulo-build = { path = "../../crates/ulo-build" }

[dev-dependencies]
ex-support = { path = "../support" }
serde_json.workspace = true
# The span type an in-memory exporter collects.
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
