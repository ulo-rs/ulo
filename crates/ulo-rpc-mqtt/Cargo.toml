[package]
name = "ulo-rpc-mqtt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The MQTT v5 link for Ulo RPC: shared subscriptions, Response Topic and Correlation Data"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "mqtt"]
categories = ["network-programming"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
ulo-rpc = { path = "../ulo-rpc", version = "=0.1.0-alpha.1" }
ulo-runtime-tokio = { path = "../ulo-runtime-tokio", version = "=0.1.0-alpha.1" }
ulo-transport = { path = "../ulo-transport", version = "=0.1.0-alpha.1" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
# rumqttc's default `use-rustls` is what `mqtts://` connects through.
rumqttc.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[features]
# Builds `tests/conformance.rs`, which starts an MQTT broker in a container per scenario and so needs
# a running Docker daemon.
integration = []
# For the conformance suite; not an application feature. It builds the link's `probe()`, through
# which the suite's held-`cancel` scenarios read the client's table, withhold the server's
# `opened` and shorten the link's hold, and turns on `ulo-rpc`'s `conformance-probe`. The tests
# enable it through this crate's dev-dependency on itself.
conformance-probe = ["ulo-rpc/conformance-probe"]

[dev-dependencies]
# Itself with `conformance-probe`, for `tests/conformance.rs`.
ulo-rpc-mqtt = { path = ".", features = ["conformance-probe"] }
futures-executor.workspace = true
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }
ulo-rpc-conformance = { path = "../ulo-rpc-conformance", features = ["tokio"] }

[lints]
workspace = true
