[package]
name = "ulo-runtime-smol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The smol runtime for Ulo: the core's Runtime on an async-executor Executor and async-io's timers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["asynchronous"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.3" }
async-executor.workspace = true
async-io.workspace = true
# `spawn_blocking`'s pool, smol's `unblock`; already in the tree through async-net and async-process.
blocking.workspace = true
# `block_on`'s stop signal to its workers; already in the tree through async-lock.
event-listener.workspace = true
tracing.workspace = true

# `shutdown_signal`'s OS signals, read through their `Stream`; async-io's, as the timers are.
[target.'cfg(any(unix, windows))'.dependencies]
async-signal.workspace = true
futures-core.workspace = true

[dev-dependencies]
ulo-runtime-conformance = { path = "../ulo-runtime-conformance" }
# `tests/run.rs` writes the child's log to its stdout, where the parent reads it.
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
