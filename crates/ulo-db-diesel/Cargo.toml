[package]
name = "ulo-db-diesel"
version.workspace = true
edition.workspace = true
# `std::fs::File::lock` for the SQLite sidecar lock is stable from 1.89; diesel 2.3.14 declares 1.86
# and diesel-async 0.9.2 declares 1.84.
rust-version = "1.89"
description = "Diesel store for Ulo: a deadpool pool of diesel-async connections with the shared connect, health and migration-lock policy"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "diesel", "diesel-async", "database"]
categories = ["database"]

[features]
default = []
postgres = ["diesel-async/postgres", "dep:tokio-postgres"]
mysql = ["diesel-async/mysql", "dep:mysql_async"]
sqlite = ["diesel-async/sqlite", "diesel/sqlite"]
# Builds the Postgres and MySQL halves of `tests/conformance.rs`, which start a server in a container
# per scenario and so need a running Docker daemon. The SQLite half needs only a file.
integration = []

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1", features = ["serde"] }
ulo-config = { path = "../ulo-config", version = "=0.1.0-alpha.1" }
ulo-db = { path = "../ulo-db", version = "=0.1.0-alpha.1" }
deadpool = { workspace = true, features = ["rt_tokio_1"] }
diesel.workspace = true
# `migrations` brings `AsyncConnectionWrapper` and `diesel_migrations`.
diesel-async = { workspace = true, features = ["deadpool", "migrations"] }
diesel_migrations.workspace = true
# The URL parsers of the drivers diesel-async connects through, so `validate` refuses at `wire` what
# `establish` would refuse at `connect`. Declared as diesel-async 0.9.2 declares them, so the build
# holds one copy of each.
mysql_async = { version = "0.36.0", default-features = false, features = ["minimal-rust"], optional = true }
tokio-postgres = { version = "0.7.10", default-features = false, optional = true }
serde = { workspace = true, features = ["derive"] }
# `rt`: `Handle`, the given runtime's, which `Given` calls `spawn_blocking` on. `rt-multi-thread`:
# `block_in_place`, through which a dropped SQLite query waits for its blocking task.
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
testcontainers.workspace = true
ulo-db-conformance = { path = "../ulo-db-conformance", features = ["tokio"] }

[lints]
workspace = true
