[package]
name = "ulo-db-diesel"
version.workspace = true
edition.workspace = true
# `std::fs::File::lock` for the SQLite sidecar lock is stable from 1.89; diesel 2.3.14 declares 1.86
# and diesel-async 0.9.2 declares 1.84.
rust-version = "1.89"
description = "Diesel store for Ulo: a deadpool pool of diesel-async connections with the shared connect, health and migration-lock policy"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "diesel", "diesel-async", "database"]
categories = ["database"]

[features]
default = []
postgres = ["diesel-async/postgres"]
mysql = ["diesel-async/mysql"]
sqlite = ["diesel-async/sqlite", "diesel/sqlite"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1", features = ["serde"] }
ulo-config = { path = "../ulo-config", version = "=0.1.0-alpha.1" }
ulo-db = { path = "../ulo-db", version = "=0.1.0-alpha.1" }
deadpool = { workspace = true, features = ["rt_tokio_1"] }
diesel.workspace = true
# `migrations` brings `AsyncConnectionWrapper` and `diesel_migrations`.
diesel-async = { workspace = true, features = ["deadpool", "migrations"] }
diesel_migrations.workspace = true
serde = { workspace = true, features = ["derive"] }
# `rt`: `Handle`, the given runtime's, which `Given` calls `spawn_blocking` on.
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[lints]
workspace = true
