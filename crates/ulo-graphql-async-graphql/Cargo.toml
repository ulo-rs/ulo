[package]
name = "ulo-graphql-async-graphql"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
description = "The async-graphql engine for Ulo's GraphQL bindings"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "graphql", "async-graphql"]
categories = ["web-programming"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
ulo-graphql = { path = "../ulo-graphql", version = "=0.1.0-alpha.1" }
async-graphql = { workspace = true, features = ["graphiql"] }
futures-util.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
ulo-runtime-tokio = { path = "../ulo-runtime-tokio" }
# `macros` and `rt`: `#[tokio::test]`, the one runtime the app is given; `time`: the deadline each test runs under.
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
