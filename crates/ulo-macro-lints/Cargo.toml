[package]
name = "ulo-macro-lints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Every attribute and derive macro the framework exports, expanded in one crate for CI to lint as a user's crate"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Linted only: nothing depends on it, and it is never released.
publish = false

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.3" }
ulo-grpc = { path = "../ulo-grpc", version = "=0.1.0-alpha.3" }
ulo-http = { path = "../ulo-http", version = "=0.1.0-alpha.3" }
ulo-rpc = { path = "../ulo-rpc", version = "=0.1.0-alpha.3" }
ulo-transport = { path = "../ulo-transport", version = "=0.1.0-alpha.3" }
ulo-ws = { path = "../ulo-ws", version = "=0.1.0-alpha.3" }
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }

[build-dependencies]
ulo-build = { path = "../ulo-build", version = "=0.1.0-alpha.3" }

[lints]
workspace = true
