[package]
name = "ulo-runtime-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The tokio runtime for Ulo: the core's Runtime and Timer, OS shutdown signals and spawn helpers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["asynchronous"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.3" }
# `rt-multi-thread` for the runtime `run` builds.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "signal", "macros", "net"] }
tracing.workspace = true

[dev-dependencies]
ulo-runtime-conformance = { path = "../ulo-runtime-conformance" }
futures-executor.workspace = true
# `tests/run.rs` writes the child's log to its stdout, where the parent reads it.
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
