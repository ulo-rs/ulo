[package]
name = "ulo-runtime-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The tokio runtime for Ulo: the core's Runtime and Timer, OS shutdown signals and spawn helpers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["asynchronous"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
tokio = { workspace = true, features = ["rt", "time", "signal", "macros", "net"] }

[dev-dependencies]
ulo-runtime-conformance = { path = "../ulo-runtime-conformance" }
futures-executor.workspace = true
# `tests/own_subscriber.rs` installs a global subscriber before the suite's.
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
