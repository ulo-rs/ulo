[package]
name = "ulo-db-mongodb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MongoDB store for Ulo: a Client with the shared connect and health policy, its mongodb+srv lookup retried under the connect bound"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "mongodb", "database"]
categories = ["database"]

[features]
# Builds `tests/conformance.rs`, which starts a server in a container per scenario and so needs a
# running Docker daemon.
integration = []

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1", features = ["serde"] }
ulo-config = { path = "../ulo-config", version = "=0.1.0-alpha.1" }
ulo-db = { path = "../ulo-db", version = "=0.1.0-alpha.1" }
# mongodb's default features: `rustls-tls` is rustls over ring, the workspace's provider, and
# `dns-resolver` is what `mongodb+srv` needs. `compat-3-0-0` selects the driver's `bson` 2.
mongodb = { workspace = true, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
testcontainers.workspace = true
ulo-db-conformance = { path = "../ulo-db-conformance", features = ["tokio"] }

[lints]
workspace = true
