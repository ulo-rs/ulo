[package]
name = "ulo-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The RPC transport for Ulo: one frame grammar over TCP, UDP and message brokers, the four call shapes, and the client"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "microservices", "framework"]
categories = ["network-programming", "asynchronous"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
ulo-rpc-macros = { path = "../ulo-rpc-macros", version = "=0.1.0-alpha.1" }
ulo-transport = { path = "../ulo-transport", version = "=0.1.0-alpha.1" }
# `serde` so `Bytes` and `Payload<Bytes>` travel as a CBOR byte string.
bytes = { workspace = true, features = ["serde"] }
ciborium.workspace = true
# No runtime here, as in the core: tasks are spawned through the app's `Runtime`, and these are
# the runtime-free primitives in place of `tokio::sync`. The client's connection lock.
async-lock.workspace = true
# A streamed request's items and each call's reply frames.
futures-channel.workspace = true
futures-core.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tracing.workspace = true

[features]
# For the conformance suite; not an application feature. It builds `__private::ClientProbe`, which
# a broker link holds under its own `conformance-probe` so the suite's held-`cancel` scenarios can
# withhold a server's `opened` and shorten the link's hold. Without it no link compiles the paths
# that withhold or delay an `opened`.
conformance-probe = []

[dev-dependencies]
ulo-runtime-tokio = { path = "../ulo-runtime-tokio" }
# For `RpcClient::new`'s example, which runs, so a link it names refuses it if the example drifts.
ulo-rpc-tcp = { path = "../ulo-rpc-tcp" }
# `test-util`: the client timeout tests run on a paused clock.
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "test-util"] }

[lints]
workspace = true
