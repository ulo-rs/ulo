[package]
name = "ulo-rpc-tcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The TCP link for Ulo RPC: length-prefixed frames multiplexed by id over one connection"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "tcp"]
categories = ["network-programming"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
ulo-net = { path = "../ulo-net", version = "=0.1.0-alpha.1" }
ulo-rpc = { path = "../ulo-rpc", version = "=0.1.0-alpha.1" }
# The wire, shared with ulo-rpc-tcp-smol; this crate supplies tokio's sockets and runtime.
ulo-rpc-tcp-core = { path = "../ulo-rpc-tcp-core", version = "=0.1.0-alpha.1" }
ulo-runtime-tokio = { path = "../ulo-runtime-tokio", version = "=0.1.0-alpha.1" }
tokio = { workspace = true, features = ["net", "io-util", "rt"] }
tokio-rustls.workspace = true
# `compat`: tokio's sockets on `futures-io`'s traits, the ones the shared wire reads and writes.
tokio-util = { workspace = true, features = ["compat"] }

[dev-dependencies]
# The interop test: a client of either TCP link against a server of the other.
ulo-rpc-tcp-smol = { path = "../ulo-rpc-tcp-smol" }
ulo-transport = { path = "../ulo-transport" }
futures-util.workspace = true
tracing.workspace = true
futures-executor.workspace = true
ulo-rpc-conformance = { path = "../ulo-rpc-conformance", features = ["tokio"] }
# The certificate the TLS suites serve, made when they run.
ulo-test-certs = { path = "../ulo-test-certs" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
