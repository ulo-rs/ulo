[package]
name = "ulo-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Layered configuration for Ulo: TOML, JSON, YAML, .env and the environment read into one tree whose every value knows its origin, and typed sections that report every problem at once"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "config", "configuration", "toml", "dotenv"]
categories = ["config"]

[features]
# YAML 1.2 files, read through `saphyr`'s `MarkedYaml` after a bound on alias expansion.
yaml = ["dep:saphyr", "dep:saphyr-parser"]

[dependencies]
# `serde`: `Secret<T>: Deserialize` and the collector `ulo-config` installs around each section.
ulo = { path = "../ulo", version = "=0.1.0-alpha.1", features = ["serde"] }
jsonc-parser.workspace = true
# The event stream of the pre-scan that bounds alias expansion; `saphyr` re-exports none of it.
saphyr = { workspace = true, optional = true }
saphyr-parser = { workspace = true, optional = true }
serde.workspace = true
# `Defaults::of` reads a `Default` value through `serde_json::to_value`, whose `Null` is an `Option`'s `None`.
serde_json.workspace = true
# `parse`: the spanned reader; `std` and `serde` are what it needs beside it.
toml = { workspace = true, features = ["std", "serde", "parse"] }
# The warning for a key no section read.
tracing.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
