[package]
name = "ulo-rpc-kafka"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Kafka link for Ulo RPC: consumer groups, a reply topic and correlation headers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "kafka"]
categories = ["network-programming"]

[features]
# `security.protocol=SSL`, selected by an `ssl://` broker entry, through librdkafka's OpenSSL.
tls = ["rdkafka/ssl"]
# Builds `tests/conformance.rs`, which starts a Kafka broker in a container per scenario and so
# needs a running Docker daemon.
integration = []
# For the conformance suite; not an application feature. It builds the link's `probe()`, through
# which the suite's held-`cancel` scenarios read the client's table, withhold the server's
# `opened` and shorten the link's hold, and turns on `ulo-rpc`'s `conformance-probe`. The tests
# enable it through this crate's dev-dependency on itself.
conformance-probe = ["ulo-rpc/conformance-probe"]

[dependencies]
ulo = { path = "../ulo" }
ulo-rpc = { path = "../ulo-rpc" }
ulo-tokio = { path = "../ulo-tokio" }
ulo-transport = { path = "../ulo-transport" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
rdkafka.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Itself with `conformance-probe`, for `tests/conformance.rs`.
ulo-rpc-kafka = { path = ".", features = ["conformance-probe"] }
futures-executor.workspace = true
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
ulo-rpc-conformance = { path = "../ulo-rpc-conformance", features = ["tokio"] }

[lints]
workspace = true
