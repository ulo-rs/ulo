[package]
name = "ulo-runtime-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The conformance suite every Ulo runtime runs"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ulo", "runtime", "conformance", "testing"]
categories = ["development-tools::testing", "asynchronous"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.3" }
ulo-transport = { path = "../ulo-transport", version = "=0.1.0-alpha.3" }
# The runtime-free oneshot and unbounded channels the scenarios signal through. The suite names no
# runtime: each runtime crate's `Harness` brings its own executor.
futures.workspace = true
# The recording subscriber the scenario reading the core's `warn` installs.
tracing.workspace = true

[dev-dependencies]
# The README's first run, compiled as a doctest of this crate: the suite stamped over the smol
# runtime. A dev-dependency cycle Cargo allows.
ulo-runtime-smol = { path = "../ulo-runtime-smol" }

[lints]
workspace = true
