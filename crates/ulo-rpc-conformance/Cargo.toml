[package]
name = "ulo-rpc-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The conformance suite every Ulo RPC link runs"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ulo", "rpc", "conformance", "testing"]
categories = ["development-tools::testing", "network-programming"]

[features]
# `OnTokio`, the runtime half of every link built on tokio.
tokio = ["ulo-conformance-support/tokio"]
# `OnSmol`, the runtime half of a link on smol: an `async-executor` `Executor` per scenario.
smol = ["ulo-conformance-support/smol"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.2" }
# `conformance-probe`: `Broker::probe` names the broker links' `ClientProbe`.
ulo-rpc = { path = "../ulo-rpc", version = "=0.1.0-alpha.2", features = ["conformance-probe"] }
# The harness pieces shared with the database suite, re-exported here, the macro's `Slots` among
# them.
ulo-conformance-support = { path = "../ulo-conformance-support", version = "=0.1.0-alpha.2" }
ulo-transport = { path = "../ulo-transport", version = "=0.1.0-alpha.2" }
# `serde` lets the binary scenario send and receive `Bytes` as raw bytes.
bytes = { workspace = true, features = ["serde"] }
# The plain-thread scenario drives its client with `block_on`, which needs no runtime.
futures-executor.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# The README's first run, compiled as a doctest of this crate: the suite stamped over the TCP link,
# with `OnTokio`. A dev-dependency cycle Cargo allows.
ulo-rpc-conformance = { path = ".", features = ["tokio"] }
ulo-rpc-tcp = { path = "../ulo-rpc-tcp" }

# Runs where both harnesses are built: `--features tokio,smol`, or a workspace build, where the link
# crates turn both on.
[[test]]
name = "harness"
required-features = ["tokio", "smol"]

[[test]]
name = "skips"
required-features = ["tokio"]

[lints]
workspace = true
