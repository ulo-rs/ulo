[package]
name = "ulo-rpc-conformance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Shared conformance suite for ulo's RPC transports"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A dev-dependency of the transport crates and of nothing else. Cargo strips
# dev-dependencies when publishing them, so this never needs a crates.io release.
publish = false

[dependencies]
ulo = { path = "../ulo", default-features = false }
ulo-macros = { path = "../ulo-macros" }
futures = { workspace = true, features = ["async-await"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tokio-stream.workspace = true
