[package]
name = "ulo-rpc-conformance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The conformance suite every Ulo RPC link runs"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A dev-dependency of the link crates and of nothing else. Cargo strips dev-dependencies when
# publishing them, so this never needs a crates.io release.
publish = false

[features]
# `OnTokio`, the runtime half of every link built on tokio.
tokio = ["dep:ulo-tokio", "dep:tokio"]
# `OnSmol`, the runtime half of a link on smol: an `async-executor` `Executor` per scenario.
smol = ["dep:ulo-smol", "dep:async-io"]

[dependencies]
ulo = { path = "../ulo" }
# `conformance-probe`: `Broker::probe` names the broker links' `ClientProbe`.
ulo-rpc = { path = "../ulo-rpc", features = ["conformance-probe"] }
ulo-smol = { path = "../ulo-smol", optional = true }
ulo-tokio = { path = "../ulo-tokio", optional = true }
ulo-transport = { path = "../ulo-transport" }
async-io = { workspace = true, optional = true }
# `serde` lets the binary scenario send and receive `Bytes` as raw bytes.
bytes = { workspace = true, features = ["serde"] }
# The relay's threads signal their ends through its oneshot, which needs no runtime.
futures-channel.workspace = true
# The plain-thread scenario drives its client with `block_on`, which needs no runtime.
futures-executor.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
# `rt-multi-thread`: `OnTokio`'s runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net"], optional = true }

# Runs where both harnesses are built: `--features tokio,smol`, or a workspace build, where the link
# crates turn both on.
[[test]]
name = "harness"
required-features = ["tokio", "smol"]
