[package]
name = "ulo-db-sqlx"
version.workspace = true
edition.workspace = true
# SQLx 0.9.0 and `sqlx-sqlite` declare 1.94, as `ulo-http-salvo` declares 1.92.
rust-version = "1.94"
description = "SQLx stores for Ulo: Postgres, MySQL and SQLite pools with the shared connect, health and migration-lock policy"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "sqlx", "postgres", "mysql", "sqlite"]
categories = ["database"]

[features]
default = ["tls"]
# TLS through rustls over ring with the platform's roots: ring is the provider the workspace's
# `rustls` entry is built with, so no second provider is added. No `mysql-rsa`: over TLS
# `caching_sha2_password`'s full authentication needs no RSA key exchange.
tls = ["sqlx/tls-rustls-ring-native-roots", "dep:rustls"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
# Builds the Postgres and MySQL halves of `tests/conformance.rs`, which start a server in a container
# per scenario and so need a running Docker daemon. The SQLite half needs only a file.
integration = []

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1", features = ["serde"] }
ulo-config = { path = "../ulo-config", version = "=0.1.0-alpha.1" }
ulo-db = { path = "../ulo-db", version = "=0.1.0-alpha.1" }
# `runtime-tokio` alone: SQLx with both runtime features picks at every spawn, and the name check in
# `ulo-db` guarantees a tokio context on every path that runs a query.
sqlx = { workspace = true, features = ["runtime-tokio", "migrate"] }
serde = { workspace = true, features = ["derive"] }
# The SQLite migration lock waits on a thread of its own and answers through a oneshot.
futures-channel.workspace = true
tracing.workspace = true
# The type of a refused server certificate, which SQLx hands back inside an I/O error; SQLx's own
# rustls, so no second copy or provider.
rustls = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
testcontainers.workspace = true
# `support/server.rs` issues the TLS recipe's certificates.
ulo-test-certs = { path = "../ulo-test-certs" }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
ulo-db-conformance = { path = "../ulo-db-conformance", features = ["tokio"] }

[lints]
workspace = true
