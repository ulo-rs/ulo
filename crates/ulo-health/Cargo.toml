[package]
name = "ulo-health"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Health checks module for the Ulo framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
http = ["dep:reqwest"]
memory = ["dep:sysinfo", "sysinfo?/system"]
disk = ["dep:sysinfo", "sysinfo?/disk"]
timeout = ["dep:tokio"]

[dependencies]
ulo = { path = "../ulo", default-features = false }
async-trait.workspace = true
serde_json.workspace = true
futures.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
sysinfo = { version = "0.38", default-features = false, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
