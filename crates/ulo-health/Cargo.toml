[package]
name = "ulo-health"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Health for Ulo: checks with bounds, liveness, readiness and startup probes, and the module that turns readiness false before the first refusal at shutdown"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "health", "kubernetes", "probes"]
categories = ["web-programming"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
# `Shared`: a probe arriving while a run is in flight shares that run. `catch_unwind` and
# `Shared` need its default `std` feature.
futures-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# `ScriptedTimer`: the clock whose refusal `tests/lag_refused.rs` reads.
ulo-conformance-support = { path = "../ulo-conformance-support" }
# The test drives an app on its clock alone, from a plain thread.
futures-executor.workspace = true

[lints]
workspace = true
