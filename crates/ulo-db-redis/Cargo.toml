[package]
name = "ulo-db-redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Redis store for Ulo: a ConnectionManager with the shared connect and health policy, tokio-comp alone"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "redis", "database"]
categories = ["database"]

[features]
# `rediss://`, through rustls with the webpki roots, as `ulo-rpc-redis`'s `tls` feature does.
tls = ["redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1", features = ["serde"] }
ulo-config = { path = "../ulo-config", version = "=0.1.0-alpha.1" }
ulo-db = { path = "../ulo-db", version = "=0.1.0-alpha.1" }
# The workspace entry brings `aio` and `tokio-comp`, the one runtime feature this crate takes.
redis = { workspace = true, features = ["connection-manager"] }
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[lints]
workspace = true
