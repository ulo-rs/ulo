[package]
name = "ulo-ws-hyper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The standalone WebSocket server for Ulo: gateways declared `port = own`, on hyper and the listener of the app's runtime"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "websocket", "hyper", "server"]
categories = ["web-programming::websocket", "network-programming"]

[features]
default = ["tokio"]
# The tokio listener and the `Server` alias over it. Off, the server takes the listener a caller
# names, `ServerOn<L>`, and no tokio runtime crate is built.
tokio = ["dep:ulo-listener-tokio"]
# For the conformance tests; not an application feature. It builds `Server::messages_read`, which
# `tests/limits.rs` reads to hold a saturated server's connections to reading nothing more, and
# turns on `ulo-ws`'s `conformance-probe`. The tests enable it through this crate's dev-dependency
# on itself.
conformance-probe = ["ulo-ws/conformance-probe"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
# `Upgraded`, the `futures-io` stream `ulo-ws`'s driver serves.
ulo-http = { path = "../ulo-http", version = "=0.1.0-alpha.1" }
ulo-server-hyper = { path = "../ulo-server-hyper", version = "=0.1.0-alpha.1" }
ulo-listener-tokio = { path = "../ulo-listener-tokio", version = "=0.1.0-alpha.1", optional = true }
ulo-net = { path = "../ulo-net", version = "=0.1.0-alpha.1" }
ulo-transport = { path = "../ulo-transport", version = "=0.1.0-alpha.1" }
ulo-ws = { path = "../ulo-ws", version = "=0.1.0-alpha.1" }
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
# The responses' bodies.
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
tracing.workspace = true

[dev-dependencies]
# Itself with `conformance-probe`, for `tests/limits.rs`.
ulo-ws-hyper = { path = ".", features = ["conformance-probe"] }
# The WebSocket conformance suite, which `tests/conformance.rs` runs against the server.
ulo-ws-conformance = { path = "../ulo-ws-conformance" }
# `tokio-io`: the tests' tokio clients reach the suite as `Upgraded::from_tokio`.
ulo-http = { path = "../ulo-http", features = ["tokio-io"] }
# `smol`: `OnSmol`, the runtime half `conformance_smol.rs` runs its scenarios on.
ulo-http-conformance = { path = "../ulo-http-conformance", features = ["smol"] }
ulo-listener-smol = { path = "../ulo-listener-smol" }
# `starvation`: the one-thread executor, ticker and watchdog the flood tests run in.
ulo-conformance-support = { path = "../ulo-conformance-support", features = ["smol"] }
ulo-runtime-smol = { path = "../ulo-runtime-smol" }
ulo-runtime-tokio = { path = "../ulo-runtime-tokio" }
async-net.workspace = true
futures-io.workspace = true
# `sink`: the tests write through `SinkExt` on the client's socket.
futures-util = { workspace = true, features = ["sink"] }
# The MessagePack gateway's frames, which `messages.rs` encodes and decodes.
rmp-serde.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync", "net", "io-util"] }
# `connect`: the tests drive each gateway through a real WebSocket client.
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true
