[package]
name = "ulo-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Build-script code generation for ulo-grpc: messages, clients and the method markers handlers bind to, over a vendored protoc"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "grpc", "tonic", "build", "codegen"]
categories = ["development-tools::build-utils"]

[features]
# A vendored `protoc`, so no system protoc is needed; a `PROTOC` environment variable wins over it.
default = ["vendored-protoc"]
vendored-protoc = ["dep:protoc-bin-vendored"]

[dependencies]
# What tonic-prost-build parses and prints its generated code with: the client code is parsed
# again to bind `tonic` in its modules.
prettyplease.workspace = true
prost-build.workspace = true
protoc-bin-vendored = { workspace = true, optional = true }
syn = { workspace = true, features = ["full"] }
tonic-prost-build.workspace = true

[lints]
workspace = true
