[package]
name = "ulo-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Endpoints, socket activation, TLS loading and bound addresses for Ulo transports"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["network-programming"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.3" }
rustls = { workspace = true }
rustls-pki-types = { workspace = true, features = ["std"] }
# `FD_CLOEXEC` on an inherited socket and the socket's type check, which std does not expose.
socket2 = { workspace = true, features = ["all"] }
tracing = { workspace = true }

# The listen-state read on the Unix targets where socket2 has no `is_listener`.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Placing descriptors from 3 on in the children `tests/activation.rs` starts.
[target.'cfg(unix)'.dev-dependencies]
command-fds = { workspace = true }

[dev-dependencies]
# The certificate `tests/tls.rs` serves, made when the tests run.
ulo-test-certs = { path = "../ulo-test-certs" }
# The runtime a panicking lookup runs on, in `host.rs`'s tests.
ulo-runtime-tokio = { path = "../ulo-runtime-tokio" }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
