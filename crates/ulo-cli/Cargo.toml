[package]
name = "ulo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for Ulo"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ulo"
path = "src/main.rs"

[features]
default = ["dev"]
# The `ulo dev` watch/rebuild/restart command. Carries the watchexec
# dependency tree; disable for a lean scaffolding-only install.
dev = [
    "dep:watchexec",
    "dep:watchexec-events",
    "dep:watchexec-filterer-globset",
    "dep:watchexec-signals",
    "dep:ignore-files",
    "dep:command-fds",
]

# Placing the held socket at descriptor 3 between fork and exec.
[target.'cfg(unix)'.dependencies]
command-fds = { workspace = true, optional = true }

[dependencies]
anyhow.workspace = true
clap = { version = "4.5.27", features = ["derive"] }
colored = "3.0.0"
glob = "0.3"
ignore-files = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
watchexec = { workspace = true, optional = true }
watchexec-events = { workspace = true, optional = true }
watchexec-filterer-globset = { workspace = true, optional = true }
watchexec-signals = { workspace = true, optional = true }

[lints]
workspace = true
