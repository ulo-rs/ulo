[package]
name = "ulo-cli"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "CLI for Ulo"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ulo"
path = "src/main.rs"

[features]
default = ["dev"]
# The `ulo dev` watch/rebuild/restart command. Carries the watchexec
# dependency tree; disable for a lean scaffolding-only install.
dev = [
    "dep:watchexec",
    "dep:watchexec-events",
    "dep:watchexec-filterer-globset",
    "dep:watchexec-signals",
    "dep:ignore-files",
    "dep:libc",
]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dependencies]
anyhow.workspace = true
clap = { version = "4.5.27", features = ["derive"] }
colored = "3.0.0"
ignore-files = { version = "3.0.5", optional = true }
regex = "1.11.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
watchexec = { version = "8.2.0", optional = true }
watchexec-events = { version = "6.1.0", optional = true }
watchexec-filterer-globset = { version = "8.0.0", optional = true }
watchexec-signals = { version = "5.0.1", optional = true }
