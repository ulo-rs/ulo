[package]
name = "ulo-conformance-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The harness pieces the Ulo conformance suites share"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A dependency of the suite crates, none of which is published, and a dev-dependency of the
# crates whose tests run on its harnesses or time on its `ScriptedTimer`. Cargo strips
# dev-dependencies when publishing, so this never needs a crates.io release.
publish = false

[features]
# `OnTokio`, the runtime half of every suite run on tokio.
tokio = ["dep:ulo-runtime-tokio", "dep:tokio"]
# `OnSmol`, the runtime half of a suite on smol: an `async-executor` `Executor` per scenario.
smol = ["dep:ulo-runtime-smol"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
ulo-runtime-smol = { path = "../ulo-runtime-smol", version = "=0.1.0-alpha.1", optional = true }
ulo-runtime-tokio = { path = "../ulo-runtime-tokio", version = "=0.1.0-alpha.1", optional = true }
# The relay's threads signal their ends through its oneshot, which needs no runtime.
futures-channel.workspace = true
# `rt-multi-thread`: `OnTokio`'s runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net"], optional = true }

[dev-dependencies]
# Itself with `smol`, so `tests/starvation.rs` builds whatever features the run selects.
ulo-conformance-support = { path = ".", features = ["smol"] }

[lints]
workspace = true
