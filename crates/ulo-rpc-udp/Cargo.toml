[package]
name = "ulo-rpc-udp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The UDP link for Ulo RPC: one frame per datagram, unary calls and events"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "udp"]
categories = ["network-programming"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
ulo-rpc = { path = "../ulo-rpc", version = "=0.1.0-alpha.1" }
ulo-tokio = { path = "../ulo-tokio", version = "=0.1.0-alpha.1" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
ulo-net = { path = "../ulo-net", version = "=0.1.0-alpha.1" }
ulo-transport = { path = "../ulo-transport", version = "=0.1.0-alpha.1" }
socket2.workspace = true
tokio = { workspace = true, features = ["net", "sync", "rt", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
futures-executor.workspace = true
ulo-rpc-conformance = { path = "../ulo-rpc-conformance", features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
