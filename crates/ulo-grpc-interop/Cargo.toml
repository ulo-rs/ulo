[package]
name = "ulo-grpc-interop"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "The gRPC project's interop TestService on ulo-grpc, for the CI job that runs the standard interop client against it"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# CI support: nothing depends on it, and it is never released.
publish = false

[dependencies]
ulo = { path = "../ulo" }
# Also tonic, prost and the codec, through its re-exports. Its tonic carries the `gzip` and
# `tls-ring` features `ulo-grpc-interop-client` compresses its requests, inflates replies and dials
# the TLS pass with.
ulo-grpc = { path = "../ulo-grpc" }
ulo-runtime-tokio = { path = "../ulo-runtime-tokio" }
# `certs DIR`: the CA and server certificate of the runner's TLS pass, generated per run.
ulo-test-certs = { path = "../ulo-test-certs" }
# The pre-dispatch entry recording each request message's compressed flag.
ulo-http = { path = "../ulo-http" }
bytes.workspace = true
http-body.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
futures-util.workspace = true
# `ulo-grpc-interop-client`: the message it compresses by hand, the call it writes by hand over
# the channel, and the channel wrapped to read reply flags.
flate2.workspace = true
http.workspace = true
http-body-util.workspace = true
tower.workspace = true

[build-dependencies]
ulo-build = { path = "../ulo-build" }

[lints]
workspace = true
