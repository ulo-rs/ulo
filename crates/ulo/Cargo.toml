[package]
name = "ulo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["http", "web", "framework"]
categories = ["asynchronous", "network-programming", "web-programming"]
description = "Fast and modular web framework for scalable applications"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
# The runtime-free async once-cell behind the per-execution cache and the shutdown outcome.
async-lock = "3.4"
ulo-macros = { path = "../ulo-macros", version = "=0.1.0-alpha.1" }
# The `warn` for a panic raised while a spawned task's future is dropped, which no caller is
# waiting to receive.
tracing.workspace = true
# `Secret<T>: Deserialize` behind the `serde` feature, for `ulo-config` (integrations I3).
serde = { workspace = true, optional = true }

[dev-dependencies]
# `ModuleDef::enhancer`'s doc example names two transports.
ulo-http = { path = "../ulo-http" }
ulo-rpc = { path = "../ulo-rpc" }
# The README's quick start and its second example, compiled as doctests.
ulo-http-hyper = { path = "../ulo-http-hyper" }
ulo-transport = { path = "../ulo-transport" }
serde = { workspace = true, features = ["derive"] }
# Integration tests under `tests/` build apps on the tokio runtime; a dev-dependency cycle Cargo allows.
ulo-runtime-tokio = { path = "../ulo-runtime-tokio" }
# `rt-multi-thread`: `undeclared_reads.rs` runs constructions in parallel on eight workers.
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }

[features]
serde = ["dep:serde"]

[lints]
workspace = true
