[package]
name = "ulo-http-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runs a Ulo application inside an axum server, nested under a path or as the fallback"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "axum", "embedding", "web"]
categories = ["web-programming::http-server"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.3" }
ulo-http = { path = "../ulo-http", version = "=0.1.0-alpha.3" }
axum = { workspace = true, features = ["tokio", "http1", "http2", "original-uri"] }
http.workspace = true
# The upgrade future axum's server leaves in the request's extensions, and its I/O as tokio's traits.
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
tower.workspace = true
# `compat`: hyper's upgraded I/O, tokio's traits through `TokioIo`, reaches `Upgraded::from_futures`
# as `futures-io`'s.
tokio-util = { workspace = true, features = ["compat"] }

[dev-dependencies]
ulo-http-conformance = { path = "../ulo-http-conformance", features = ["tokio"] }
# `tests/ws_conformance.rs`: the WebSocket suite against `WsModule`'s hand-off inside axum.
ulo-ws-conformance = { path = "../ulo-ws-conformance" }
ulo-runtime-tokio = { path = "../ulo-runtime-tokio" }
ulo-ws = { path = "../ulo-ws" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }

[lints]
workspace = true
