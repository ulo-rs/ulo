[package]
name = "ulo-db-seaorm"
version.workspace = true
edition.workspace = true
# SeaORM 2.0.4 declares 1.94.
rust-version = "1.94"
description = "SeaORM store for Ulo: a DatabaseConnection with the shared connect, health and migration-lock policy, its URL validated by SQLx's option parser"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "sea-orm", "database", "orm"]
categories = ["database"]

[features]
default = ["tls"]
# SQLx's TLS, shared with `ulo-db-sqlx`: one SQLx in the build, rustls over ring.
tls = ["ulo-db-sqlx/tls"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres", "ulo-db-sqlx/postgres"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql", "ulo-db-sqlx/mysql"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite", "ulo-db-sqlx/sqlite"]

# Builds the Postgres and MySQL halves of `tests/conformance.rs`, which start a server in a container
# per scenario and so need a running Docker daemon. The SQLite half needs only a file.
integration = []

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1", features = ["serde"] }
ulo-config = { path = "../ulo-config", version = "=0.1.0-alpha.1" }
ulo-db = { path = "../ulo-db", version = "=0.1.0-alpha.1" }
# The shared scheme check and SQLx's option parser; this crate takes SQLx through SeaORM 2.0 and
# through this crate, so a build holds one.
ulo-db-sqlx = { path = "../ulo-db-sqlx", version = "=0.1.0-alpha.1", default-features = false }
sea-orm = { workspace = true, features = ["runtime-tokio"] }
sea-orm-migration = { workspace = true, features = ["runtime-tokio"] }
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
ulo-db-conformance = { path = "../ulo-db-conformance", features = ["tokio"] }

[lints]
workspace = true
