[package]
name = "ulo-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The HTTP transport for Ulo: routing, extractors, responses, SSE, pre-dispatch middleware, the backend SPI and the embedding surface"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "http", "web", "framework"]
categories = ["web-programming::http-server", "asynchronous"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.3" }
ulo-http-macros = { path = "../ulo-http-macros", version = "=0.1.0-alpha.3" }
ulo-net = { path = "../ulo-net", version = "=0.1.0-alpha.3" }
ulo-transport = { path = "../ulo-transport", version = "=0.1.0-alpha.3" }
bytes.workspace = true
futures-core.workspace = true
# The I/O traits an upgraded connection implements.
futures-io.workspace = true
futures-util.workspace = true
headers.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
multer.workspace = true
percent-encoding.workspace = true
pin-project-lite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
# The doc examples of `Server`, `config` and `embed` name a backend and a host; a dev-dependency
# cycle Cargo allows.
ulo-http-hyper = { path = "../ulo-http-hyper" }
ulo-http-axum = { path = "../ulo-http-axum" }
axum.workspace = true
ulo-runtime-tokio = { path = "../ulo-runtime-tokio" }
# `ScriptedTimer`: the clock whose refusal the keep-alive's unit test reads.
ulo-conformance-support = { path = "../ulo-conformance-support" }
# `futures-io`'s extension traits, through which `tests/upgraded.rs` drives an `Upgraded`.
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }

[lints]
workspace = true
