[package]
name = "ulo-ws-redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Redis broadcast adapter for Ulo's WebSocket transport, carrying broadcasts across processes"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "websocket", "redis", "broadcast"]
categories = ["web-programming::websocket"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
ulo-ws = { path = "../ulo-ws", version = "=0.1.0-alpha.1" }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
# `tokio-rustls-comp`: `rediss://` connects over TLS.
redis = { workspace = true, features = ["tokio-rustls-comp"] }
ulo-runtime-tokio = { path = "../ulo-runtime-tokio", version = "=0.1.0-alpha.1" }
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true

[features]
# Builds `tests/integration.rs`, which starts a Redis server in a container and so needs a running
# Docker daemon.
integration = []

[dev-dependencies]
# The relay helpers that start a container on a port no host listener shadows.
ulo-rpc-conformance = { path = "../ulo-rpc-conformance" }
ulo-ws-hyper = { path = "../ulo-ws-hyper" }
# `ScriptedTimer`: the app's clock in the tests that time the subscription's bound.
ulo-conformance-support = { path = "../ulo-conformance-support" }
futures-executor.workspace = true
# `sink`: the test writes through `SinkExt` on each client's socket.
futures-util = { workspace = true, features = ["sink"] }
serde_json.workspace = true
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
# `connect`: the test drives each instance's gateway through a real WebSocket client.
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true
