[package]
name = "ulo-rpc-tcp-smol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The TCP link for Ulo RPC on smol's sockets: ulo-rpc-tcp's wire over async-net, with futures-rustls for TLS"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ulo", "rpc", "tcp", "smol"]
categories = ["network-programming"]

[dependencies]
ulo = { path = "../ulo", version = "=0.1.0-alpha.1" }
ulo-net = { path = "../ulo-net", version = "=0.1.0-alpha.1" }
ulo-rpc = { path = "../ulo-rpc", version = "=0.1.0-alpha.1" }
# The wire, shared with ulo-rpc-tcp; this crate supplies `async-io`'s sockets.
ulo-rpc-tcp-core = { path = "../ulo-rpc-tcp-core", version = "=0.1.0-alpha.1" }
async-net.workspace = true
futures-rustls.workspace = true
# `io`: a TLS connection split into its two halves.
futures-util = { workspace = true, features = ["io"] }

[dev-dependencies]
ulo-rpc-conformance = { path = "../ulo-rpc-conformance", features = ["smol"] }
ulo-runtime-smol = { path = "../ulo-runtime-smol" }
# `starvation` and `ScriptedTimer`: the one-thread executor, ticker and watchdog the flood tests run in.
ulo-conformance-support = { path = "../ulo-conformance-support", features = ["smol"] }
# The certificate the TLS suite serves, made when it runs.
ulo-test-certs = { path = "../ulo-test-certs" }
ulo-transport = { path = "../ulo-transport" }
futures-executor.workspace = true
# The lingering tests read back the buffer sizes the kernel granted their sockets.
socket2.workspace = true

[lints]
workspace = true
