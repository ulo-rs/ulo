[package]
name = "ulo-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Macros for Ulo"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["asynchronous", "network-programming", "web-programming"]

[lib]
name = "ulo_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "visit-mut"] }
# The `__handler` grammar and the key and shared-value emission `#[handlers]` writes, defined once
# for `#[handlers]` and every transport attribute.
ulo-handler-codegen = { path = "../ulo-handler-codegen", version = "=0.1.0-alpha.2" }

[dev-dependencies]
# The unit tests compare where an emitted token sits with where it was written.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# The `#[module]` doctest wires an application.
ulo = { path = "../ulo" }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
