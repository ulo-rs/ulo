[package]
name = "ulo-macros"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Macros for Ulo"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["asynchronous", "network-programming", "web-programming"]

[lib]
name = "ulo_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies]
indexmap = "2.7.0"
proc-macro2 = "1.0.92"
quote = "1.0.38"
syn = { version = "2.0.94", features = ["visit-mut", "default", "full"] }

[dev-dependencies]
ulo = { path = "../ulo" }
trybuild = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
