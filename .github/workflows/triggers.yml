name: workflow triggers

# No branch filter: this workflow runs on a push to any branch and on every pull request, so a
# branch filter elsewhere that leaves out the default branch fails here, where that filter would
# keep its own workflow from running at all. The default branch comes from the event, since
# `actions/checkout` sets no `origin/HEAD`.
on: [push, pull_request]

jobs:
  default-branch:
    name: workflow triggers name the default branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/workflow_branches.py check "${{ github.event.repository.default_branch }}"
