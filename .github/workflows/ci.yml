name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: check (all features, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-features compiles the feature-gated test targets (e.g. the DB
      # crates' `integration` health tests) that a default build never touches.
      # --locked fails on a manifest/lockfile mismatch instead of silently
      # resolving fresh versions the repo doesn't record.
      - run: cargo check --workspace --all-features --all-targets --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links are warnings by default, so they rot unnoticed:
      # every one this gate was written for dated from an earlier rename.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-features because a doc comment behind a feature gate is only
      # linted when that feature is on, and --no-deps because upstream crates'
      # doc warnings are not ours to fix. --lib because ulo-cli's binary target
      # is named `ulo`, so documenting it writes into target/doc/ulo/ alongside
      # the library of that name and the two rustdoc invocations race for the
      # directory; selecting library targets documents every crate that has one
      # and no binaries, which is the whole of what this gate is for.
      - run: cargo doc --workspace --all-features --no-deps --lib --locked

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Hermetic suites only — everything here runs against localhost with no
      # external services. Broker and DB crates keep their service-dependent
      # tests behind feature gates and are compile-checked in the check job.
      - run: cargo test -p ulo --lib --locked
      - run: cargo test -p integration-tests --locked
      # The build-script companion: pure functions over tonic's generated text.
      - run: cargo test -p ulo-build --locked
      # Startup-failure reporting and connection-string redaction for the database modules.
      # Hermetic: no server is contacted. Their service-dependent suites stay behind the
      # `integration` feature and are compile-checked by the job above.
      - run: cargo test -p ulo-db-seaorm -p ulo-db-redis -p ulo-db-mongodb --lib --test startup --locked
      - run: cargo test -p ulo-db-sqlx --features postgres --lib --test startup --locked
      - run: cargo test -p ulo-db-diesel --features postgres --lib --test startup --locked
      # Prisma has no server to reach: `for_root` takes a closure producing the
      # generated client, so its whole surface is registration.
      - run: cargo test -p ulo-db-prisma --locked
      # Each crate's own hermetic suite. Named explicitly rather than with
      # `--workspace`, which would pull in every service-gated target. Before this
      # line existed the `check` job compiled these and nothing ran them, so they
      # could stop being true but never start failing. The adapter suites are the
      # only proof that WebSocket upgrade works on poem, salvo and rocket, and
      # that actix collects a request body rather than streaming it.
      - run: >
          cargo test --locked --lib --tests
          -p ulo-config -p ulo-health -p ulo-cli
          -p ulo-http-axum -p ulo-http-actix -p ulo-http-poem
          -p ulo-http-salvo -p ulo-http-rocket
          -p ulo-rpc-tcp -p ulo-rpc-udp -p ulo-rpc-nats -p ulo-rpc-redis
          -p ulo-rpc-rabbitmq -p ulo-rpc-mqtt -p ulo-rpc-kafka
          -p ulo-ws-tungstenite -p ulo-ws-redis -p ulo-grpc
      # ulo-macros' unit tests only. Its `diagnostics` target compares rustc's
      # rendering and runs on a pinned compiler in the job below, so that a
      # reworded diagnostic cannot fail an unrelated pull request here.
      - run: cargo test -p ulo-macros --lib --locked
      # Doc examples compile in no other job: `--all-targets` skips them and the
      # docs job renders without running them. Only examples not marked `ignore`
      # are covered.
      - run: cargo test --workspace --all-features --doc --locked

  msrv-matrix:
    name: msrv matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Read from the manifests rather than listed here, so a crate that changes
      # its floor moves between legs without this file being touched.
      - id: read
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
            | jq -c '[.packages[] | select(.rust_version) | .rust_version] | unique')
          echo "versions=$v" >> "$GITHUB_OUTPUT"
          echo "declared floors: $v"

  msrv:
    name: msrv ${{ matrix.rust }}
    needs: msrv-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ${{ fromJSON(needs.msrv-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # A declared `rust-version` is a promise to a user on that compiler, and the
      # floors come from third-party dependencies that raise theirs without notice.
      # Compile the crates making the promise with the compiler they name.
      - run: |
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg v '${{ matrix.rust }}' '.packages[] | select(.rust_version == $v) | "-p " + .name' \
            | tr '\n' ' ')
          test -n "$pkgs" || { echo "no crate declares ${{ matrix.rust }}"; exit 1; }
          echo "checking: $pkgs"
          cargo check --all-features --locked $pkgs

  diagnostics:
    name: macro diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned on purpose, and the one pin in this file that is not read from a
      # manifest. `tests/diagnostics/*.stderr` records rustc's rendering as well
      # as the macros' own text, and rustc rewords its half roughly once every
      # three minor versions: on `stable` that arrives as a red build on a pull
      # request that changed nothing related. Bumping this version is its own
      # change, where the snapshot diff is the thing being reviewed — which is
      # when a diagnostic that got worse is actually noticed.
      #
      # Regenerate after an intended change, on this same version:
      #     TRYBUILD=overwrite cargo test -p ulo-macros --test diagnostics
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ulo-macros --test diagnostics --locked

  scaffold:
    name: cli scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ulo-cli --locked
      # `ulo new` output pins published crate versions; patching them to the
      # checkout verifies the templates against the code under review. A version
      # bump that forgets to update the templates fails here loudly.
      - name: scaffold a project and compile it
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/target/debug/ulo" new scaffold-smoke
          cd scaffold-smoke
          "$GITHUB_WORKSPACE/target/debug/ulo" generate resource user
          cat >> Cargo.toml <<EOF
          [patch.crates-io]
          ulo = { path = "$GITHUB_WORKSPACE/crates/ulo" }
          ulo-macros = { path = "$GITHUB_WORKSPACE/crates/ulo-macros" }
          ulo-http-axum = { path = "$GITHUB_WORKSPACE/crates/ulo-http-axum" }
          EOF
          cargo check
