[package]
name = "toni-tungstenite"
version = "0.1.0"
edition.workspace = true
description = "tokio-tungstenite adapter for separate-port WebSocket deployment with the Toni framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["toni", "websocket", "tungstenite", "adapter"]
categories = ["web-programming::websocket"]

[dependencies]
toni = { path = "../toni", default-features = false }
tokio = { workspace = true, features = ["net", "sync", "rt", "macros"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
