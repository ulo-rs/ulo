[package]
name = "toni-redis-rpc"
version = "0.1.0"
edition.workspace = true
description = "Redis Pub/Sub transport adapter for the Toni RPC gateway"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["toni", "redis", "rpc", "framework", "adapter"]
categories = ["network-programming"]

[features]
# Gates tests that need a live Redis (via testcontainers + Docker).
integration = []

[dependencies]
toni = { path = "../toni", default-features = false }
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
futures = { workspace = true, features = ["async-await", "executor"] }

[dev-dependencies]
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["redis"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream.workspace = true
