[package]
name = "toni-async-graphql"
version = "0.1.0"
edition.workspace = true
description = "async-graphql integration for Toni framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["graphql", "async-graphql", "toni", "web", "framework"]
categories = ["web-programming", "asynchronous"]

[dependencies]
toni = { path = "../toni", version = "0.2.0", default-features = false }
toni-macros = { path = "../toni-macros", version = "0.2.0" }
async-graphql = "7.0"
futures.workspace = true
tokio = { workspace = true, features = ["rt"] }
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
toni-axum = { path = "../toni-axum" }
reqwest = "0.12"
tokio = { workspace = true, features = ["full"] }
