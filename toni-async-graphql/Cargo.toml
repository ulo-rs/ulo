[package]
name = "toni-async-graphql"
version = "0.1.0"
edition.workspace = true
description = "async-graphql integration for Toni framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["graphql", "async-graphql", "toni", "web", "framework"]
categories = ["web-programming", "asynchronous"]

[dependencies]
toni = { path = "../toni", version = "0.2.0", default-features = false }
toni-macros = { path = "../toni-macros", version = "0.2.0" }
async-graphql = "7.0"
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
toni-axum = { path = "../toni-axum" }
reqwest = "0.12"
tokio = { version = "1.47", features = ["full"] }
