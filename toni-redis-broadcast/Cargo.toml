[package]
name = "toni-redis-broadcast"
version = "0.1.0"
edition.workspace = true
description = "Redis-backed cross-process WebSocket broadcasting for the Toni framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
integration = []

[dependencies]
toni = { path = "../toni", default-features = false }
redis = { workspace = true, features = ["tokio-comp"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
futures-util.workspace = true

[dev-dependencies]
toni-axum = { path = "../toni-axum" }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["redis"] }
